kind = "web"
previewPath = "/"
title = "Nuvora"
description = "A configurable business operations and organizational intelligence workspace for executive, people, and operations teams."
version = "1.0.0"
id = "artifacts/nuvora"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 3000

[services.development]
run = "npm run dev --workspace=@workspace/nuvora"

[services.production]
build = [ "npm", "run", "build", "--workspace=@workspace/nuvora" ]
serve = "npm run start --workspace=@workspace/nuvora"

[services.env]
PORT = "3000"
